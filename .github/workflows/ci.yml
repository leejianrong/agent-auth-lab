name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-build:
    name: Docs site builds cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install zensical
      - run: zensical build --clean --strict

  generator-check:
    name: Starter packs match their solutions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check every lab's starter is generated from its solution
        run: |
          set -e
          for lab in labs/*/; do
            echo "checking ${lab%/}"
            python3 scripts/generate_starter.py --check "${lab%/}"
          done

  stepper-generator:
    name: Stepper generator tests and generated blocks are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest scripts/tests -v
      - name: Every page's stepper blocks match their .flow files
        run: |
          set -e
          for page in $(grep -l '<!-- stepper:' docs/course/*.md); do
            python3 scripts/stepper_gen.py --check "$page"
          done

  backend-solution-tests:
    name: Backend solution self-checks (must all pass)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lab:
          - lab-00-sessions-cookies
          - lab-01-jwt
          - lab-02-rbac
          - lab-03-abac-rebac
          - lab-04-oidc
          - lab-05-consent-revocation
          - lab-06-service-to-service
          - lab-07-agent-identity
          - lab-08-opa-tool-scopes
          - lab-09-on-behalf-of
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        working-directory: labs/${{ matrix.lab }}/solution/backend
        run: pip install -r requirements.txt
      - name: Install OPA (lab 08 onward starts a real policy engine in its tests)
        run: |
          curl -fsSL -o opa https://openpolicyagent.org/downloads/v1.21.2/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version
      - name: pytest
        working-directory: labs/${{ matrix.lab }}/solution/backend
        run: pytest tests/ -v

  backend-starter-smoke:
    name: Backend starters import cleanly (behavior is intentionally incomplete)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lab:
          - lab-00-sessions-cookies
          - lab-01-jwt
          - lab-02-rbac
          - lab-03-abac-rebac
          - lab-04-oidc
          - lab-05-consent-revocation
          - lab-06-service-to-service
          - lab-07-agent-identity
          - lab-08-opa-tool-scopes
          - lab-09-on-behalf-of
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        working-directory: labs/${{ matrix.lab }}/starter/backend
        run: pip install -r requirements.txt
      - name: Import smoke test
        working-directory: labs/${{ matrix.lab }}/starter/backend
        run: python -c "from app.main import app"

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lab:
          - lab-00-sessions-cookies
          - lab-01-jwt
          - lab-02-rbac
          - lab-03-abac-rebac
          - lab-04-oidc
          - lab-05-consent-revocation
          - lab-06-service-to-service
          - lab-07-agent-identity
          - lab-08-opa-tool-scopes
          - lab-09-on-behalf-of
        variant: [solution, starter]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install
        working-directory: labs/${{ matrix.lab }}/${{ matrix.variant }}/frontend
        run: npm install
      - name: Type-check
        working-directory: labs/${{ matrix.lab }}/${{ matrix.variant }}/frontend
        run: npm run check
      - name: Build
        working-directory: labs/${{ matrix.lab }}/${{ matrix.variant }}/frontend
        run: npm run build
